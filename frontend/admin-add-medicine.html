<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Medicine - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        /* --- Existing styles from your original page, unchanged --- */
        * {margin: 0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;}
        body {background: linear-gradient(135deg,#021346 0%,#220242 100%); color:#fff; min-height:100vh; display:flex;}
        .dashboard-container {display:flex;width:100%;}
        .sidebar {width:280px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);padding:30px 0;height:100vh;position:fixed;box-shadow:0 8px 32px rgba(0,0,0,0.1);border-right:1px solid rgba(255,255,255,0.2);}
        .sidebar h2{text-align:center;margin-bottom:40px;padding-bottom:20px;font-weight:700;font-size:1.8rem;border-bottom:1px solid rgba(255,255,255,0.2);background:linear-gradient(135deg,#fff,#e2e8f0);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
        .sidebar ul{list-style:none;padding:0 20px;}
        .sidebar li{margin-bottom:12px;border-radius:12px;overflow:hidden;transition:all 0.3s ease;}
        .sidebar li:hover{background:rgba(255,255,255,0.1);}
        .sidebar a{color:rgba(255,255,255,0.9);text-decoration:none;display:block;padding:15px 20px;transition:all 0.3s ease;border-radius:12px;font-weight:500;display:flex;align-items:center;gap:12px;}
        .sidebar a:hover{color:white; transform:translateX(5px);}
        .sidebar a.active{background:rgba(87, 5, 5, 0.616); color:rgb(7, 1, 1);box-shadow:0 4px 15px rgba(255,255,255,0.1);}
        .main-content{flex:1;margin-left:280px;padding:40px;display:flex;flex-direction:column;align-items:center;}
        .page-title{
            text-align:center;
            margin-bottom:40px;
            font-size:2.5rem;
            font-weight:800;
            background:linear-gradient(135deg,#fff,#e2e8f0);
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
            text-shadow:0 4px 8px rgba(0,0,0,0.1);
        }
        .medicine-form{background:rgba(255,255,255,0.15);backdrop-filter:blur(12px);border-radius:24px;padding:40px;box-shadow:0 8px 32px rgba(0,0,0,0.1);border:1px solid rgba(255,255,255,0.2);margin-bottom:40px;max-width:900px;width:100%;position:relative;overflow:hidden;}
        .medicine-form::after{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcf7f,#4d96ff);background-size:400% 400%;animation:gradientShift 3s ease infinite;}
        @keyframes gradientShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
        .medicine-form-row{display:flex;gap:30px;margin-bottom:25px;}
        .medicine-form-group{flex:1;display:flex;flex-direction:column;}
        .medicine-form-group label{font-size:1.1rem;font-weight:600;margin-bottom:10px;color:rgba(255,255,255,0.9);}
        .medicine-form-group input{font-size:1.1rem;padding:14px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:white;transition:all 0.3s ease;}
        .medicine-form-group input:focus{outline:none;border-color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.15);box-shadow:0 0 0 3px rgba(255,255,255,0.1);}
        .medicine-form-group input::placeholder{color:rgba(255,255,255,0.6);}
        .action-buttons{display:flex;gap:16px;margin-top:20px;justify-content:center;}
        .action-button{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);color:white;border:1px solid rgba(255,255,255,0.2);padding:16px 32px;border-radius:16px;font-weight:600;cursor:pointer;transition:all 0.3s ease;box-shadow:0 8px 20px rgba(0,0,0,0.1);display:flex;align-items:center;gap:10px;font-size:1.1rem;}
        .action-button:hover{transform:translateY(-5px);background:rgba(255,255,255,0.25);box-shadow:0 12px 25px rgba(0,0,0,0.2);}
        .success-message{background:rgba(107,207,127,0.2);border:1px solid rgba(107,207,127,0.4);color:#6bcf7f;padding:16px 24px;border-radius:12px;font-weight:600;margin-top:20px;text-align:center;display:none;}
        .table-container{background:rgba(255,255,255,0.15);backdrop-filter:blur(12px);border-radius:24px;padding:30px;box-shadow:0 8px 32px rgba(0,0,0,0.1);border:1px solid rgba(255,255,255,0.2);max-width:1000px;width:100%;}
        .table-container h2{margin-top:0;color:white;font-size:1.8rem;font-weight:700;margin-bottom:20px;text-align:center;}
        .medicine-table{width:100%;border-collapse:collapse;margin-top:20px;border-radius:16px;overflow:hidden;}
        .medicine-table th, .medicine-table td{padding:16px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.1);}
        .medicine-table th{background:rgba(255,255,255,0.15);color:white;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;font-size:0.9rem;}
        .medicine-table tr{transition:all 0.3s ease;}
        .medicine-table tr:hover{background:rgba(255,255,255,0.1);}
        .medicine-table tr:last-child td{border-bottom:none;}
        .action-btn{padding:8px 16px;border-radius:8px;border:none;font-weight:600;margin-right:8px;cursor:pointer;transition:all 0.3s ease;display:inline-flex;align-items:center;gap:6px;}
        .action-btn.delete{background:rgba(239,68,68,0.3);color:white;border:1px solid rgba(239,68,68,0.5);}
        .action-btn.update{background:rgba(59,130,246,0.3);color:white;border:1px solid rgba(59,130,246,0.5);}
        .action-btn.delete:hover{background:rgba(239,68,68,0.5);transform:translateY(-2px);}
        .action-btn.update:hover{background:rgba(59,130,246,0.5);transform:translateY(-2px);}
        @media (max-width:1024px){.sidebar{width:240px;}.main-content{margin-left:240px;}}
        @media (max-width:768px){.sidebar{width:200px;}.main-content{margin-left:200px;padding:20px;}.medicine-form-row{flex-direction:column;gap:20px;}.action-buttons{flex-direction:column;align-items:center;}.action-button{width:100%;max-width:300px;justify-content:center;}.medicine-table{display:block;overflow-x:auto;}}
    </style>
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li><a href="admin-user-tracking.html"><i class="fas fa-user-chart"></i> User Tracking</a></li>
                <li><a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Admin Dashboard</a></li>
                <li><a href="admin-sales-view.html"><i class="fas fa-chart-line"></i> View Sales</a></li>
                <li><a class="active" href="admin-add-medicine.html"><i class="fas fa-pills"></i> Add Medicine</a></li>
                <li><a href="admin-stock-view.html"><i class="fas fa-boxes"></i> View Inventory</a></li>
                <li><a href="admin-notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <h1 class="page-title">Add New Medicine</h1>
            
            <form id="addMedicineForm" class="medicine-form">
                <div class="medicine-form-row">
                    <div class="medicine-form-group">
                        <label for="medicineName"><i class="fas fa-capsules"></i> Medicine Name (and optional strength)</label>
                        <input type="text" id="medicineName" name="medicineName" placeholder="e.g. Paracetamol 500mg" required>
                    </div>
                    <div class="medicine-form-group">
                        <label for="medicineBatch"><i class="fas fa-barcode"></i> Batch / Lot Number</label>
                        <input type="text" id="medicineBatch" name="medicineBatch" placeholder="Enter batch/lot number" required>
                    </div>
                </div>
                <div class="medicine-form-row">
                    <div class="medicine-form-group">
                        <label for="medicineQuantity"><i class="fas fa-box"></i> Quantity</label>
                        <input type="number" id="medicineQuantity" name="medicineQuantity" min="1" placeholder="Enter quantity" required>
                    </div>
                    <div class="medicine-form-group">
                        <label for="medicineExpiry"><i class="fas fa-calendar-alt"></i> Expiry Date</label>
                        <input type="date" id="medicineExpiry" name="medicineExpiry" required>
                    </div>
                </div>
                <div class="medicine-form-row">
                    <div class="medicine-form-group">
                        <label for="medicinePrice"><i class="fas fa-tag"></i> Price</label>
                        <input type="number" id="medicinePrice" name="medicinePrice" min="0" step="0.01" placeholder="Enter price" required>
                    </div>
                    <div class="medicine-form-group">
                        <label for="medicineSupplier"><i class="fas fa-truck"></i> Supplier</label>
                        <input type="text" id="medicineSupplier" name="medicineSupplier" placeholder="Enter supplier name" required>
                    </div>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="action-button"><i class="fas fa-plus-circle"></i> Add Medicine</button>
                </div>
            </form>
            
            <div id="addMedicineSuccess" class="success-message">
                <i class="fas fa-check-circle"></i> Medicine added successfully!
            </div>

            <div class="table-container">
                <h2>Current Inventory</h2>
                <table class="medicine-table" id="medicineTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Batch</th>
                            <th>Quantity</th>
                            <th>Expiry</th>
                            <th>Price</th>
                            <th>Supplier</th>
                            <th>Time Added</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const TOKEN = localStorage.getItem('token'); // JWT from login
        if (!TOKEN) window.location.href = 'login.html'; // redirect if not logged in

        const API_URL = 'http://localhost:5000/api/medicines';
        const form = document.getElementById('addMedicineForm');
        const tableBody = document.querySelector('#medicineTable tbody');
        const successMsg = document.getElementById('addMedicineSuccess');

        // --- Fetch and render table ---
        async function fetchMedicines() {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                if (!res.ok) throw new Error('Failed to fetch medicines');
                const data = await res.json();
                renderTable(data);
            } catch (err) {
                console.error(err);
            }
        }

        function renderTable(medicines) {
            tableBody.innerHTML = '';
            if (medicines.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:rgba(255,255,255,0.7);">No medicines in inventory.</td></tr>';
                return;
            }
            medicines.forEach(med => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${med.name}</td>
                        <td>${med.batch || ''}</td>
                        <td>${med.quantity}</td>
                        <td>${new Date(med.expiry).toLocaleDateString()}</td>
                        <td>${med.price.toFixed(2)}</td>
                        <td>${med.supplier || ''}</td>
                        <td>${new Date(med.createdAt || med.updatedAt).toLocaleString()}</td>
                        <td>
                            <button class="action-btn update" onclick="startUpdateMedicine('${med._id}')"><i class="fas fa-edit"></i> Update</button>
                            <button class="action-btn delete" onclick="deleteMedicine('${med._id}')"><i class="fas fa-trash"></i> Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        // --- Add medicine ---
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('medicineName').value.trim(),
                batch: document.getElementById('medicineBatch').value.trim(),
                quantity: parseInt(document.getElementById('medicineQuantity').value, 10),
                expiry: document.getElementById('medicineExpiry').value,
                price: parseFloat(document.getElementById('medicinePrice').value),
                supplier: document.getElementById('medicineSupplier').value.trim()
            };
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TOKEN}`
                    },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Failed to add medicine');
                successMsg.style.display = 'block';
                setTimeout(() => successMsg.style.display = 'none', 3000);
                form.reset();
                fetchMedicines();
            } catch (err) {
                console.error(err);
            }
        });

        // --- Delete medicine ---
        async function deleteMedicine(id) {
            if (!confirm('Are you sure you want to delete this medicine?')) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                if (!res.ok) throw new Error('Failed to delete medicine');
                fetchMedicines();
            } catch (err) {
                console.error(err);
            }
        }

        // --- Update medicine ---
        async function startUpdateMedicine(id) {
            try {
                const res = await fetch(`${API_URL}/${id}`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                if (!res.ok) throw new Error('Failed to fetch medicine');
                const med = await res.json();
                document.getElementById('medicineName').value = med.name;
                document.getElementById('medicineBatch').value = med.batch || '';
                document.getElementById('medicineQuantity').value = med.quantity;
                document.getElementById('medicineExpiry').value = med.expiry.split('T')[0];
                document.getElementById('medicinePrice').value = med.price;
                document.getElementById('medicineSupplier').value = med.supplier || '';

                // Remove old entry on submit
                form.onsubmit = async e => {
                    e.preventDefault();
                    const payload = {
                        name: document.getElementById('medicineName').value.trim(),
                        batch: document.getElementById('medicineBatch').value.trim(),
                        quantity: parseInt(document.getElementById('medicineQuantity').value, 10),
                        expiry: document.getElementById('medicineExpiry').value,
                        price: parseFloat(document.getElementById('medicinePrice').value),
                        supplier: document.getElementById('medicineSupplier').value.trim()
                    };
                    try {
                        const res = await fetch(`${API_URL}/${id}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${TOKEN}`
                            },
                            body: JSON.stringify(payload)
                        });
                        if (!res.ok) throw new Error('Failed to update medicine');
                        form.reset();
                        fetchMedicines();
                        successMsg.style.display = 'block';
                        setTimeout(() => successMsg.style.display = 'none', 3000);
                        form.onsubmit = defaultSubmit;
                    } catch (err) { console.error(err); }
                };
            } catch (err) { console.error(err); }
        }

        // Keep default submit intact
        const defaultSubmit = form.onsubmit;

        // Initial fetch
        fetchMedicines();
    </script>
    <script src="responsive-nav.js"></script>
</body>
</html>
