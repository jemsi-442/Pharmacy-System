<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px 0;
            height: 100vh;
            position: fixed;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            font-weight: 700;
            font-size: 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #fff, #e2e8f0);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sidebar ul {
            list-style: none;
            padding: 0 20px;
        }
        
        .sidebar li {
            margin-bottom: 12px;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .sidebar li:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            display: block;
            padding: 15px 20px;
            transition: all 0.3s ease;
            border-radius: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sidebar a:hover {
            color: white;
            transform: translateX(5px);
        }
        
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #e2e8f0);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
            justify-content: center;
        }
        
        .action-button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }
        
        .action-button:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        }
        
        /* Dashboard Cards - Consistent with User Tracking */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 40px;
            max-width: 900px;
            width: 100%;
        }
        
        .dashboard-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            z-index: -1;
        }
        
        .dashboard-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .dashboard-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .dashboard-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        
        .dashboard-card:hover .dashboard-icon {
            transform: scale(1.1) rotate(5deg);
            background: rgba(255, 255, 255, 0.3);
        }
        
        .dashboard-icon::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
            border-radius: 20px;
        }
        
        .dashboard-card:nth-child(1) .dashboard-icon {
            color: #4d96ff;
        }
        
        .dashboard-card:nth-child(2) .dashboard-icon {
            color: #6bcf7f;
        }
        
        .dashboard-card:nth-child(3) .dashboard-icon {
            color: #ffd93d;
        }
        
        .dashboard-card h2 {
            margin: 0 0 15px 0;
            font-size: 1.3rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .dashboard-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .success {
            color: #6bcf7f !important;
        }
        
        .danger {
            color: #ff6b6b !important;
        }
        
        .warning {
            color: #ffd93d !important;
        }
        
        /* Logout Button Styling */
        .logout-btn {
            margin-top: 20px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ff6b6b;
        }
        
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            color: white;
        }
        
        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .dashboard-cards {
                grid-template-columns: 1fr;
                max-width: 500px;
            }
            
            .sidebar {
                width: 240px;
            }
            
            .main-content {
                margin-left: 240px;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .main-content {
                margin-left: 200px;
                padding: 20px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .action-button {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="admin-user-tracking.html"><i class="fas fa-user-chart"></i> User Tracking</a></li>
            <li><a href="admin-dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Admin Dashboard</a></li>
            <li><a href="admin-sales-view.html"><i class="fas fa-chart-line"></i> View Sales</a></li>
            <li><a href="admin-add-medicine.html"><i class="fas fa-pills"></i> Add Medicine</a></li>
            <li><a href="admin-stock-view.html"><i class="fas fa-boxes"></i> View Inventory</a></li>
            <li><a href="admin-notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
            <li>
                <a href="#" id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Log Out
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <h1 class="page-title">Admin Dashboard</h1>
        
        <div class="action-buttons">
            <button id="importAllBtn" class="action-button">
                <i class="fas fa-download"></i> Import All System Data
            </button>
        </div>
        
        <div class="dashboard-cards">
            <div class="dashboard-card">
                <div class="dashboard-icon">
                    <i class="fas fa-pills"></i>
                </div>
                <h2>Total Medicines</h2>
                <div id="totalMedicines" class="dashboard-value success">0</div>
            </div>
            <div class="dashboard-card">
                <div class="dashboard-icon">
                    <i class="fas fa-money-bill-wave"></i>
                </div>
                <h2>Sales Today</h2>
                <div id="totalSalesToday" class="dashboard-value danger">0</div>
            </div>
            <div class="dashboard-card">
                <div class="dashboard-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h2>Low Stock Items</h2>
                <div id="lowStockCount" class="dashboard-value warning">0</div>
            </div>
        </div>
    </div>

<script>
    // JWT token inapaswa kupewa frontend baada ya login
    const token = localStorage.getItem('jwtToken'); // au cookie

    // Fetch medicines kutoka backend
    async function fetchMedicinesFromBackend() {
        if (!token) {
            console.error("JWT token missing! Login required.");
            return;
        }

        try {
            const response = await fetch('/api/medicines', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` // JWT header
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const medicines = await response.json();
            renderDashboard(medicines);
            renderMedicineTable(medicines);

        } catch (err) {
            console.error("Error fetching medicines:", err);
        }
    }

    // Render dashboard cards
    function renderDashboard(medicines) {
        // Total Medicines
        document.getElementById('totalMedicines').textContent = medicines.length;

        // Low stock (≤10)
        const lowStock = medicines.filter(med => med.quantity <= 10);
        document.getElementById('lowStockCount').textContent = lowStock.length;

        // Expiring soon (≤30 days)
        const today = new Date();
        const expiringSoon = medicines.filter(med => {
            const expiryDate = new Date(med.expiry);
            const diffDays = (expiryDate - today) / (1000 * 60 * 60 * 24);
            return diffDays >= 0 && diffDays <= 30;
        });
        document.getElementById('expiringCount').textContent = expiringSoon.length;
    }

    // Render medicines table
    function renderMedicineTable(medicines) {
        const tbody = document.getElementById('medicineTableBody');
        tbody.innerHTML = ''; // Clear previous rows

        medicines.forEach(med => {
            const tr = document.createElement('tr');

            tr.innerHTML = `
                <td>${med.name} ${med.strength || ''}</td>
                <td>${med.batch || ''}</td>
                <td>${med.expiry}</td>
                <td>${med.quantity}</td>
                <td>${med.supplier || ''}</td>
                <td>${med.price}</td>
                <td>
                    <span class="status-badge ${
                        med.quantity <= 10 ? 'status-low-stock' :
                        (new Date(med.expiry) - new Date() <= 30*24*60*60*1000 ? 'status-expiring' :
                        'status-in-stock') }">
                        ${
                            med.quantity <= 10 ? 'Low Stock' :
                            (new Date(med.expiry) - new Date() <= 30*24*60*60*1000 ? 'Expiring Soon' :
                            'In Stock')
                        }
                    </span>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Auto-fetch on page load
    document.addEventListener('DOMContentLoaded', () => {
        fetchMedicinesFromBackend();
        // Refresh every 10s
        setInterval(fetchMedicinesFromBackend, 10000);
    });
</script>
</body>
</html>
