<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drugs & Stock Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px 0;
            height: 100vh;
            position: fixed;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            font-weight: 700;
            font-size: 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sidebar ul {
            list-style: none;
            padding: 0 20px;
        }
        
        .sidebar li {
            margin-bottom: 12px;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .sidebar li:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            display: block;
            padding: 15px 20px;
            transition: all 0.3s ease;
            border-radius: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sidebar a:hover {
            color: white;
            transform: translateX(5px);
        }
        
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .page-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
            max-width: 1000px;
            width: 100%;
        }
        
        .summary-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            z-index: -1;
        }
        
        .summary-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        
        .summary-card:nth-child(1) .card-icon {
            color: #4d96ff;
        }
        
        .summary-card:nth-child(2) .card-icon {
            color: #ff6b6b;
        }
        
        .summary-card:nth-child(3) .card-icon {
            color: #ffd93d;
        }
        
        .summary-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .card-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: white;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        /* Table Container */
        .table-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 1000px;
            width: 100%;
        }
        
        .table-container h2 {
            margin-top: 0;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        /* Table Styling */
        .medicine-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
        }
        
        .medicine-table th, .medicine-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .medicine-table th {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
        }
        
        .medicine-table tr {
            transition: all 0.3s ease;
        }
        
        .medicine-table tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .medicine-table tr:last-child td {
            border-bottom: none;
        }
        
        .stock-status {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-low {
            background: #e74c3c;
            color: #ffffff;
            border: 1px solid rgba(231, 76, 60, 0.9);
        }
        
        .status-medium {
            background: #f39c12;
            color: #ffffff;
            border: 1px solid rgba(243,156,18,0.9);
        }
        
        .status-good {
            background: rgba(107, 207, 127, 0.2);
            color: #6bcf7f;
            border: 1px solid rgba(107, 207, 127, 0.4);
        }
        
        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .summary-cards {
                grid-template-columns: 1fr;
                max-width: 500px;
            }
            
            .sidebar {
                width: 240px;
            }
            
            .main-content {
                margin-left: 240px;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .main-content {
                margin-left: 200px;
                padding: 20px;
            }
            
            .medicine-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="home.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="sales-management.html"><i class="fas fa-cash-register"></i> Sales Management</a></li>
            <li><a href="sales-tracking.html"><i class="fas fa-chart-line"></i> Sales Tracking</a></li>
            <li><a href="drugs-stock-management.html" class="active"><i class="fas fa-pills"></i> Stock Management</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1 class="page-title">Drugs & Stock Management</h1>
        
        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card">
                <div class="card-icon">
                    <i class="fas fa-pills"></i>
                </div>
                <h3>Total Medicines</h3>
                <div id="totalMedicines" class="card-value">0</div>
            </div>
            <div class="summary-card">
                <div class="card-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h3>Low Stock Items</h3>
                <div id="lowStockCount" class="card-value">0</div>
            </div>
            <div class="summary-card">
                <div class="card-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <h3>Expiring Soon</h3>
                <div id="expiringCount" class="card-value">0</div>
            </div>
        </div>

        <!-- Medicine Table -->
        <div class="table-container">
            <h2><i class="fas fa-list-alt"></i> Medicine Stock List</h2>
            <table id="medicineTable" class="medicine-table">
                <thead>
                    <tr>
                        <th>Name & Strength</th>
                        <th>Batch/Lot</th>
                        <th>Expiry</th>
                        <th>Qty</th>
                        <th>Supplier</th>
                        <th>Price</th>
                        <th>Date Added</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="medicineTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Utility to get today's date in yyyy-mm-dd
        function getToday() {
            const d = new Date();
            return d.toISOString().split('T')[0];
        }
        
        // Check if item is expiring soon (within 30 days)
        function isExpiringSoon(expiryDate) {
            const today = new Date();
            const expiry = new Date(expiryDate);
            const diffTime = expiry - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays <= 30;
        }
        
        // Get stock status based on quantity
        function getStockStatus(quantity, expiryDate) {
            const qty = parseInt(quantity, 10);
            if (qty <= 10) {
                return { text: 'LOW STOCK', class: 'status-low' };
            } else if (qty <= 30) {
                return { text: 'MEDIUM', class: 'status-medium' };
            } else if (isExpiringSoon(expiryDate)) {
                return { text: 'EXPIRING', class: 'status-medium' };
            } else {
                return { text: 'GOOD', class: 'status-good' };
            }
        }
        
        // Medicine data management
        // Fetch medicines from main system (admin-add-medicine.html)
        function getMedicines() {
            return JSON.parse(localStorage.getItem('medicines') || '[]');
        }
        
        function renderMedicines() {
            const medicines = getMedicines();
            const tbody = document.getElementById('medicineTableBody');
            tbody.innerHTML = '';
            
            let lowStockCount = 0;
            let expiringCount = 0;
            
            if (medicines.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:rgba(255,255,255,0.7);">No medicines in stock.</td></tr>';
            } else {
                medicines.forEach((med) => {
                    const status = getStockStatus(med.quantity, med.expiry);
                    
                    // Update counters
                    if (parseInt(med.quantity, 10) <= 10) lowStockCount++;
                    if (isExpiringSoon(med.expiry)) expiringCount++;
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${med.name || ''}${med.strength ? ' ' + med.strength : ''}</td>
                        <td>${med.batch || med.strength || 'N/A'}</td>
                        <td>${med.expiry || ''}</td>
                        <td>${med.quantity || ''}</td>
                        <td>${med.supplier || ''}</td>
                        <td>${med.price !== undefined ? parseFloat(med.price).toFixed(2) : ''}</td>
                        <td>${med.dateAdded ? (new Date(med.dateAdded).toLocaleString ? new Date(med.dateAdded).toLocaleDateString() : med.dateAdded) : ''}</td>
                        <td><span class="stock-status ${status.class}">${status.text}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            
            // Update summary cards
            document.getElementById('totalMedicines').textContent = medicines.length;
            document.getElementById('lowStockCount').textContent = lowStockCount;
            document.getElementById('expiringCount').textContent = expiringCount;
        }
        
        // Initial render
        renderMedicines();
        
        // Auto-refresh data every 10 seconds
        setInterval(() => {
            renderMedicines();
        }, 10000);
    </script>
    <script src="responsive-nav.js"></script>
</body>
</html>
