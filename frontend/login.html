<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('photos/pexels-mart-production-7230326.jpg') no-repeat center center fixed,
                        url('photos/pharm.jpeg') no-repeat right bottom fixed,
                        url('photos/pharms.jpeg') no-repeat left top fixed;
            background-size: cover, 300px, 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(255,255,255,0.92);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.2);
            padding: 2.5rem 2rem;
            max-width: 370px;
            width: 100%;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 1.5rem;
            color: #2c3e50;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #34495e;
            font-weight: 500;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #b2bec3;
            border-radius: 6px;
            font-size: 1rem;
            background: #f7fafd;
            transition: border-color 0.2s;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #2980b9;
            outline: none;
        }
        .login-btn, .register-btn, .reset-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(90deg, #2980b9 60%, #6dd5fa 100%);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.08);
            transition: background 0.2s;
        }
        .login-btn:hover, .register-btn:hover, .reset-btn:hover {
            background: linear-gradient(90deg, #2471a3 60%, #48c6ef 100%);
        }
        #message {
            margin-top: 1rem;
            font-size: 2rem;
            font-weight: bold;
            padding: 2rem 2.5rem;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 300px;
            background: rgba(255,255,255,0.98);
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.18);
            border-radius: 16px;
            z-index: 9999;
            display: none;
            text-align: center;
        }
        .error { color: #e74c3c; }
        .success { color: #27ae60; display: flex; flex-direction: column; align-items: center; }
        .form-toggle { margin-top: 1.5rem; text-align: center; }
        .form-toggle a { color: #2980b9; text-decoration: underline; cursor: pointer; font-size: 1rem; }
        .form-toggle a:hover { color: #2471a3; }
        .form-container { display: none; }
        .active-form { display: block; }
        @media (max-width: 500px) {
            .login-container { padding: 1.2rem 0.5rem; max-width: 98vw; }
            body { background-size: cover, 120px, 120px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Login Form -->
        <div id="loginFormContainer" class="form-container active-form">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username (Email)</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="input-group">
                    <label for="userType">User Type</label>
                    <select id="userType" name="userType" required>
                        <option value="">Select User Type</option>
                        <option value="admin">Admin</option>
                        <option value="employee">Employee</option>
                    </select>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div style="margin-top:1rem;">
                    <a href="#" id="forgotPasswordLink" style="color:#2980b9;text-decoration:underline;font-size:1rem;">Forgot Password?</a>
                </div>
            </form>
            <div class="form-toggle">
                <p>Don't have an account? <a id="showRegisterForm">Register</a></p>
            </div>
        </div>

        <!-- Registration Form -->
        <div id="registerFormContainer" class="form-container">
            <h2>Register</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="regUsername">Name</label>
                    <input type="text" id="regUsername" name="regUsername" required>
                </div>
                <div class="input-group">
                    <label for="regPhone">Email</label>
                    <input type="email" id="regPhone" name="regPhone" required>
                </div>
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="regPassword" required>
                </div>
                <div class="input-group">
                    <label for="regUserType">User Type</label>
                    <select id="regUserType" name="regUserType" required>
                        <option value="">Select User Type</option>
                        <option value="admin">Admin</option>
                        <option value="employee">Employee</option>
                    </select>
                </div>
                <button type="submit" class="register-btn">Register</button>
            </form>
            <div class="form-toggle">
                <p>Already have an account? <a id="showLoginForm">Login</a></p>
            </div>
        </div>

        <!-- Reset Password Form -->
        <div id="resetPasswordFormContainer" class="form-container">
            <h2>Reset Password</h2>
            <form id="resetPasswordForm">
                <div class="input-group">
                    <label for="resetUsername">Email</label>
                    <input type="email" id="resetPhone" name="resetPhone" required>
                </div>
                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" required>
                </div>
                <button type="submit" class="reset-btn">Reset Password</button>
            </form>
            <div class="form-toggle">
                <p>Remember your password? <a id="showLoginFormFromReset">Login</a></p>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const API_BASE = "http://localhost:5000/api/auth";
        const msg = document.getElementById('message');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const resetForm = document.getElementById('resetPasswordForm');

        function showLoginForm() {
            document.getElementById('loginFormContainer').classList.add('active-form');
            document.getElementById('registerFormContainer').classList.remove('active-form');
            document.getElementById('resetPasswordFormContainer').classList.remove('active-form');
        }
        function showRegisterForm() {
            document.getElementById('loginFormContainer').classList.remove('active-form');
            document.getElementById('registerFormContainer').classList.add('active-form');
            document.getElementById('resetPasswordFormContainer').classList.remove('active-form');
        }
        function showResetPasswordForm() {
            document.getElementById('loginFormContainer').classList.remove('active-form');
            document.getElementById('registerFormContainer').classList.remove('active-form');
            document.getElementById('resetPasswordFormContainer').classList.add('active-form');
        }

        document.getElementById('showRegisterForm').addEventListener('click', showRegisterForm);
        document.getElementById('showLoginForm').addEventListener('click', showLoginForm);
        document.getElementById('showLoginFormFromReset').addEventListener('click', showLoginForm);
        document.getElementById('forgotPasswordLink').addEventListener('click', function(e){ e.preventDefault(); showResetPasswordForm(); });

        function showMessage(text, type) {
            msg.textContent = text;
            msg.className = type;
            msg.style.display = 'block';
            setTimeout(()=> msg.style.display='none', 1500);
        }

        // LOGIN
        loginForm.addEventListener('submit', async e=>{
            e.preventDefault();
            const email = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const userType = document.getElementById('userType').value;
            if(!email||!password||!userType){ showMessage("Please fill in all fields.", "error"); return; }

            try {
                const res = await fetch(`${API_BASE}/login`,{
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if(data.success){
                    const { token, user } = data.data;
                    localStorage.setItem("token", token);
                    localStorage.setItem("user", JSON.stringify(user));
                    msg.innerHTML = '<span style="font-size:3rem;">&#10004;</span> Login successful!';
                    msg.className = "success"; msg.style.display='flex';
                    setTimeout(()=>{
                        if(user.role==='admin') window.location.href='admin-dashboard.html';
                        else window.location.href='home.html';
                    },1000);
                } else {
                    showMessage(data.message || "Invalid credentials!", "error");
                }
            } catch(err){ showMessage("Server error.", "error"); console.error(err); }
        });

        // REGISTER
        registerForm.addEventListener('submit', async e=>{
            e.preventDefault();
            const name=document.getElementById('regUsername').value.trim();
            const email=document.getElementById('regPhone').value.trim();
            const password=document.getElementById('regPassword').value.trim();
            const role=document.getElementById('regUserType').value;
            if(!name||!email||!password||!role){ showMessage("Please fill all fields.", "error"); return; }
            try{
                const res=await fetch(`${API_BASE}/register`,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({name,email,password,role})
                });
                const data=await res.json();
                if(data.success){ showMessage("Registration successful!", "success"); setTimeout(showLoginForm,1000); }
                else showMessage(data.message || "Registration failed!", "error");
            }catch(err){ showMessage("Server error.", "error"); console.error(err); }
        });

        // RESET PASSWORD
        resetForm.addEventListener('submit', async e=>{
            e.preventDefault();
            const email = document.getElementById('resetPhone').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            if(!email||!newPassword){ showMessage("Please fill all fields.", "error"); return; }
            try{
                const res=await fetch(`${API_BASE}/reset-password`,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({email,newPassword})
                });
                const data=await res.json();
                if(data.success){ showMessage("Password reset successful!", "success"); setTimeout(showLoginForm,1500); }
                else showMessage(data.message || "Password reset failed!", "error");
            }catch(err){ showMessage("Server error.", "error"); console.error(err); }
        });
    });
    </script>
</body>
</html>
