<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px 0;
            height: 100vh;
            position: fixed;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            font-weight: 700;
            font-size: 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sidebar ul {
            list-style: none;
            padding: 0 20px;
        }
        
        .sidebar li {
            margin-bottom: 12px;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .sidebar li:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            display: block;
            padding: 15px 20px;
            transition: all 0.3s ease;
            border-radius: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sidebar a:hover {
            color: white;
            transform: translateX(5px);
        }
        
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .page-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* Table Container */
        .table-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 1000px;
            width: 100%;
            margin-bottom: 40px;
        }
        
        .table-container h2 {
            margin-top: 0;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        /* Table Styling */
        .medicine-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
        }
        
        .medicine-table th, .medicine-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .medicine-table th {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
        }
        
        .medicine-table tr {
            transition: all 0.3s ease;
        }
        
        .medicine-table tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .medicine-table tr:last-child td {
            border-bottom: none;
        }
        
        .sell-btn {
            background: rgba(107, 207, 127, 0.3);
            color: white;
            border: 1px solid rgba(107, 207, 127, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .sell-btn:hover {
            background: rgba(107, 207, 127, 0.5);
            transform: translateY(-2px);
        }
        
        .out-of-stock {
            color: #ff6b6b;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .stock-status {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-low {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.4);
        }
        
        .status-good {
            background: rgba(107, 207, 127, 0.2);
            color: #6bcf7f;
            border: 1px solid rgba(107, 207, 127, 0.4);
        }
        
        /* Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3000;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            min-width: 350px;
            position: relative;
            overflow: hidden;
        }
        
        .modal-content::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
        }
        
        .modal-input-group {
            margin-bottom: 20px;
        }
        
        .modal-input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .modal-input-group input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            width: 100px;
            text-align: center;
            margin: 0 auto;
            display: block;
        }
        
        .modal-input-group input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
        
        .modal-btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .confirm-btn {
            background: rgba(107, 207, 127, 0.3);
            color: white;
            border-color: rgba(107, 207, 127, 0.5);
        }
        
        .confirm-btn:hover {
            background: rgba(107, 207, 127, 0.5);
            transform: translateY(-2px);
        }
        
        .cancel-btn {
            background: rgba(255, 107, 107, 0.3);
            color: white;
            border-color: rgba(255, 107, 107, 0.5);
        }
        
        .cancel-btn:hover {
            background: rgba(255, 107, 107, 0.5);
            transform: translateY(-2px);
        }
        
        .error-message {
            color: #ff6b6b;
            margin-top: 15px;
            font-weight: 600;
            display: none;
        }
        
        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
            
            .main-content {
                margin-left: 240px;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .main-content {
                margin-left: 200px;
                padding: 20px;
            }
            
            .medicine-table {
                display: block;
                overflow-x: auto;
            }
            
            .modal-buttons {
                flex-direction: column;
            }
            
            .modal-content {
                min-width: 300px;
                margin: 20px;
            }
        }
        /* Sales search input styling */
        .sales-search-wrap { display:flex; justify-content:center; margin-bottom:12px; }
        .sales-search {
            width:80%;
            padding:10px 14px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.12);
            background:rgba(255,255,255,0.04);
            color:white;
            font-size:1rem;
            outline:none;
        }
        .sales-search::placeholder { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="home.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="sales-management.html" class="active"><i class="fas fa-cash-register"></i> Sales Management</a></li>
            <li><a href="sales-tracking.html"><i class="fas fa-chart-line"></i> Sales Tracking</a></li>
            <li><a href="drugs-stock-management.html"><i class="fas fa-pills"></i> Stock Management</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1 class="page-title">Sales Management</h1>
        
        <div class="table-container">
            <h2><i class="fas fa-boxes"></i> Available Stock</h2>
            <div class="sales-search-wrap">
                <input id="salesSearch" class="sales-search" type="text" placeholder="Search medicine by name, batch or strength...">
            </div>
            <table id="salesTable" class="medicine-table">
                <thead>
                    <tr>
                        <th>Name & Strength</th>
                        <th>Batch/Lot</th>
                        <th>Expiry</th>
                        <th>Qty</th>
                        <th>Supplier</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="salesTableBody"></tbody>
            </table>
        </div>
        
        <!-- Sell Modal -->
        <div id="sellModal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-title" id="sellModalTitle">Sell Item</div>
                <div class="modal-input-group">
                    <label for="sellQty">Quantity to Sell:</label>
                    <input type="number" id="sellQty" min="1" placeholder="Qty">
                </div>
                <div class="modal-buttons">
                    <button id="sellConfirmBtn" class="modal-btn confirm-btn">
                        <i class="fas fa-check"></i> Confirm Sale
                    </button>
                    <button id="sellCancelBtn" class="modal-btn cancel-btn">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
                <div id="sellError" class="error-message"></div>
            </div>
        </div>
    </div>

    <script>
        // Ensure sell modal is hidden on page load
        document.addEventListener('DOMContentLoaded', function() {
            var sellModal = document.getElementById('sellModal');
            if (sellModal) sellModal.style.display = 'none';
        });
        
        // Get medicines from localStorage
        function getMedicines() {
            return JSON.parse(localStorage.getItem('medicines') || '[]');
        }
        
        function saveMedicines(arr) {
            localStorage.setItem('medicines', JSON.stringify(arr));
        }
        
        // Get stock status
        function getStockStatus(quantity) {
            const qty = parseInt(quantity, 10);
            if (qty <= 0) {
                return { text: 'OUT OF STOCK', class: 'status-low' };
            } else if (qty <= 10) {
                return { text: 'LOW STOCK', class: 'status-low' };
            } else {
                return { text: 'IN STOCK', class: 'status-good' };
            }
        }
        
        // Render sales table with inventory check
        // renderSalesTable optionally accepts a search term to filter displayed medicines
        function renderSalesTable(searchTerm = '') {
            const medicines = getMedicines();
            const term = (searchTerm || '').toLowerCase().trim();
            const tbody = document.getElementById('salesTableBody');
            tbody.innerHTML = '';
            
            if (medicines.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:rgba(255,255,255,0.7);">No medicines in stock.</td></tr>';
                return;
            }
            
            // keep track of original index when filtering
            const visible = medicines
                .map((med, idx) => ({ med, idx }))
                .filter(item => {
                    if (!term) return true;
                    const m = item.med;
                    return (m.name || '').toLowerCase().includes(term)
                        || (m.batch || '').toLowerCase().includes(term)
                        || (m.strength || '').toLowerCase().includes(term);
                });

            visible.forEach(({ med, idx }) => {
                const outOfStock = !med.quantity || parseInt(med.quantity, 10) <= 0;
                const status = getStockStatus(med.quantity);
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${med.name || ''}${med.strength ? ' ' + med.strength : ''}</td>
                    <td>${med.batch || med.strength || ''}</td>
                    <td>${med.expiry || ''}</td>
                    <td>${med.quantity || 0}</td>
                    <td>${med.supplier || ''}</td>
                    <td>${med.price ? parseFloat(med.price).toFixed(2) : ''}</td>
                    <td><span class="stock-status ${status.class}">${status.text}</span></td>
                    <td>
                        ${outOfStock ? 
                            '<span class="out-of-stock"><i class="fas fa-times-circle"></i> Out of Stock</span>' : 
                            `<button onclick='sellMedicine(${idx})' class='sell-btn'><i class="fas fa-shopping-cart"></i> Sell</button>`
                        }
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        // Modal logic
        let sellIdx = null;
        window.sellMedicine = function(idx) {
            sellIdx = idx;
            const medicines = getMedicines();
            const med = medicines[idx];
            document.getElementById('sellModalTitle').textContent = `Sell: ${med.name}`;
            document.getElementById('sellQty').value = '';
            document.getElementById('sellQty').max = med.quantity;
            document.getElementById('sellError').style.display = 'none';
            document.getElementById('sellModal').style.display = 'flex';
        };
        
        document.getElementById('sellConfirmBtn').onclick = function() {
            const qty = parseInt(document.getElementById('sellQty').value, 10);
            const medicines = getMedicines();
            
            if (!qty || qty < 1) {
                document.getElementById('sellError').textContent = 'Please enter a valid quantity.';
                document.getElementById('sellError').style.display = 'block';
                return;
            }
            
            if (qty > parseInt(medicines[sellIdx].quantity, 10)) {
                document.getElementById('sellError').textContent = 'Not enough stock.';
                document.getElementById('sellError').style.display = 'block';
                return;
            }
            
            const med = medicines[sellIdx];
            const saleDate = new Date();
            const sale = {
                name: med.name,
                batch: med.batch || med.strength || 'N/A',
                price: med.price,
                quantity: qty,
                dateSold: saleDate.toISOString().split('T')[0],
                timeSold: saleDate.toISOString()
            };
            
            // Update stock
            medicines[sellIdx].quantity = Math.max(0, parseInt(medicines[sellIdx].quantity, 10) - qty);
            // Always store as a number
            medicines[sellIdx].quantity = Number(medicines[sellIdx].quantity);
            saveMedicines(medicines);
            
            // Sync to all pages
            localStorage.setItem('medicines', JSON.stringify(medicines));
            
            // Save sale record
            const sales = getSales();
            sales.push(sale);
            localStorage.setItem('sales', JSON.stringify(sales));
            
            renderSalesTable();
            document.getElementById('sellModal').style.display = 'none';
            sellIdx = null;
            
            // Show success message
            alert(`Successfully sold ${qty} units of ${med.name}`);
        };
        
        document.getElementById('sellCancelBtn').onclick = function() {
            document.getElementById('sellModal').style.display = 'none';
            sellIdx = null;
        };
        
        // Get sales data
        function getSales() {
            return JSON.parse(localStorage.getItem('sales') || '[]');
        }
        
        // Initial render and wire search input
        const salesSearchInput = document.getElementById('salesSearch');
        salesSearchInput.addEventListener('input', (e) => {
            renderSalesTable(e.target.value);
        });
        renderSalesTable();
        
        // Listen for inventory changes (sync across tabs/pages)
        window.addEventListener('storage', function(e) {
            if (e.key === 'medicines') {
                renderSalesTable();
            }
        });
        
        // Auto-refresh data every 10 seconds
        setInterval(() => {
            renderSalesTable();
        }, 10000);
    </script>
        <script src="responsive-nav.js"></script>
</body>
</html>
