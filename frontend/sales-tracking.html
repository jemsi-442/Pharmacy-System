<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tracking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px 0;
            height: 100vh;
            position: fixed;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            font-weight: 700;
            font-size: 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sidebar ul {
            list-style: none;
            padding: 0 20px;
        }
        
        .sidebar li {
            margin-bottom: 12px;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .sidebar li:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            display: block;
            padding: 15px 20px;
            transition: all 0.3s ease;
            border-radius: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sidebar a:hover {
            color: white;
            transform: translateX(5px);
        }
        
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .page-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        .summary-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            z-index: -1;
        }
        
        .summary-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        
        .summary-card:nth-child(1) .card-icon {
            color: #6bcf7f;
        }
        
        .summary-card:nth-child(2) .card-icon {
            color: #4d96ff;
        }
        
        .summary-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .card-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: white;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        /* Table Container */
        .table-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 1000px;
            width: 100%;
        }
        
        .table-container h2 {
            margin-top: 0;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        /* Table Styling */
        .medicine-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
        }
        
        .medicine-table th, .medicine-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .medicine-table th {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
        }
        
        .medicine-table tr {
            transition: all 0.3s ease;
        }
        
        .medicine-table tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .medicine-table tr:last-child td {
            border-bottom: none;
        }
        
        .total-row {
            background: rgba(107, 207, 127, 0.2) !important;
            font-weight: 700;
            color: white;
        }
        
        .total-row:hover {
            background: rgba(107, 207, 127, 0.3) !important;
        }
        
        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .summary-cards {
                grid-template-columns: 1fr;
                max-width: 400px;
            }
            
            .sidebar {
                width: 240px;
            }
            
            .main-content {
                margin-left: 240px;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .main-content {
                margin-left: 200px;
                padding: 20px;
            }
            
            .medicine-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="home.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="sales-management.html"><i class="fas fa-cash-register"></i> Sales Management</a></li>
            <li><a href="sales-tracking.html" class="active"><i class="fas fa-chart-line"></i> Sales Tracking</a></li>
            <li><a href="drugs-stock-management.html"><i class="fas fa-pills"></i> Stock Management</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1 class="page-title">Report ya mauzo</h1>
        
        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card">
                <div class="card-icon">
                    <i class="fas fa-money-bill-wave"></i>
                </div>
                <h3>Mauzo ya Leo</h3>
                <div id="totalProfit" class="card-value">0</div>
            </div>
            <div class="summary-card">
                <div class="card-icon">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <h3>Mwezi Ulopita</h3>
                <div id="prevMonthTotal" class="card-value">0</div>
            </div>
        </div>

        <!-- Sales Table -->
        <div class="table-container">
            <h2><i class="fas fa-list-alt"></i> Today's Sales</h2>
            <table id="soldTable" class="medicine-table">
                <thead>
                    <tr>
                        <th>Name & Strength</th>
                        <th>Batch/Lot</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Date Sold</th>
                        <th>Time Sold</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="soldTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Utility to get today's date in yyyy-mm-dd
        function getToday() {
            const d = new Date();
            return d.toISOString().split('T')[0];
        }
        
        // Utility to get current month in yyyy-mm
        function getCurrentMonth() {
            const d = new Date();
            return d.toISOString().slice(0,7);
        }
        
        // Get sales from localStorage
        function getSales() {
            return JSON.parse(localStorage.getItem('sales') || '[]');
        }
        
        // Render sold table and total
        function renderSoldTable() {
            const sales = getSales();
            const currentMonth = getCurrentMonth();
            const tbody = document.getElementById('soldTableBody');
            tbody.innerHTML = '';
            let monthTotal = 0;
            let prevMonthTotal = 0;

            // Filter and sort this month's sales
            const monthSales = sales
                .filter(sale => (sale.dateSold || '').slice(0,7) === currentMonth)
                .sort((a, b) => new Date(b.timeSold || b.dateSold) - new Date(a.timeSold || a.dateSold));

            // Group sales by date
            const salesByDate = {};
            monthSales.forEach(sale => {
                const date = sale.dateSold || '';
                if (!salesByDate[date]) salesByDate[date] = [];
                salesByDate[date].push(sale);
            });

            // Render grouped by date
            Object.keys(salesByDate).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
                const salesForDay = salesByDate[date];
                let dayTotal = 0;
                
                // Add date header row
                const dateHeader = document.createElement('tr');
                dateHeader.innerHTML = `<td colspan="7" style="background: rgba(255,255,255,0.1); font-weight: 700; color: white; text-align: center; padding: 12px;">${date}</td>`;
                tbody.appendChild(dateHeader);
                
                salesForDay.forEach(sale => {
                    const tr = document.createElement('tr');
                    const total = (parseFloat(sale.price) * parseInt(sale.quantity, 10)) || 0;
                    monthTotal += total;
                    dayTotal += total;
                    const time = sale.timeSold ? new Date(sale.timeSold).toLocaleTimeString() : '';
                    tr.innerHTML = `
                        <td>${sale.name}</td>
                        <td>${sale.batch || sale.strength || 'N/A'}</td>
                        <td>${parseFloat(sale.price).toFixed(2)}</td>
                        <td>${sale.quantity}</td>
                        <td>${sale.dateSold || ''}</td>
                        <td>${time || 'N/A'}</td>
                        <td>${total.toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                });
                
                // Add a summary row for the day
                const sumTr = document.createElement('tr');
                sumTr.className = 'total-row';
                sumTr.innerHTML = `<td colspan="6" style="text-align:right;font-weight:bold;">Jumla ya ${date}:</td><td style="font-weight:bold;">${dayTotal.toFixed(2)}</td>`;
                tbody.appendChild(sumTr);
                
                // Add spacing row
                const spacingRow = document.createElement('tr');
                spacingRow.innerHTML = '<td colspan="7" style="height: 10px; background: transparent;"></td>';
                tbody.appendChild(spacingRow);
            });

            // Calculate previous month total
            const prevMonth = (() => {
                const d = new Date(currentMonth + '-01');
                d.setMonth(d.getMonth() - 1);
                return d.toISOString().slice(0,7);
            })();
            
            sales.forEach(sale => {
                if ((sale.dateSold || '').slice(0,7) === prevMonth) {
                    prevMonthTotal += (parseFloat(sale.price) * parseInt(sale.quantity, 10)) || 0;
                }
            });

            // Update summary cards
            document.getElementById('totalProfit').textContent = monthTotal.toFixed(2);
            document.getElementById('prevMonthTotal').textContent = prevMonthTotal.toFixed(2);

            // Show message if no sales
            if (monthSales.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:rgba(255,255,255,0.7);padding:30px;">Hakuna mauzo bado kwa mwezi huu.</td></tr>';
            }

            // Reset sales data if month has changed
            const lastMonth = localStorage.getItem('lastSalesMonth');
            if (lastMonth && lastMonth !== currentMonth) {
                localStorage.setItem('sales', '[]');
            }
            localStorage.setItem('lastSalesMonth', currentMonth);
        }
        
        // Initial render
        renderSoldTable();
        
        // Listen for inventory changes (sync across tabs/pages)
        window.addEventListener('storage', function(e) {
            if (e.key === 'sales' || e.key === 'medicines') {
                renderSoldTable();
            }
        });
        
        // Auto-refresh data every 10 seconds
        setInterval(() => {
            renderSoldTable();
        }, 10000);
    </script>
        <script src="responsive-nav.js"></script>
</body>
</html>
